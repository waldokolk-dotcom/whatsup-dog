name: Whatsup Dog daily quality watch

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whatsup-dog-daily-quality-watch
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate static application
        run: node scripts/validate.mjs
      - name: Check species logic
        run: npm run test:species
      - name: Check design
        run: npm run test:design
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser usability tests
        run: npm run test:usability
      - name: Upload test evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: whatsup-dog-qa-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
