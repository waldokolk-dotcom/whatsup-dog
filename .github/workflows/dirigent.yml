name: Dirigent autonomous cycle
on:
  schedule:
    - cron: '40 5 * * 1-5'
  workflow_dispatch:
    inputs:
      issue_number:
        description: Optional approved Dirigent issue number
        required: false
        type: string
permissions:
  actions: write
  contents: write
  issues: read
  pull-requests: write
concurrency:
  group: dirigent-autonomous-cycle
  cancel-in-progress: false
jobs:
  intake-build-pr:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/dirigent.mjs self-test
      - name: Select, isolate and implement approved task
        id: execute
        env:
          GH_TOKEN: ${{ github.token }}
          DIRIGENT_ISSUE: ${{ inputs.issue_number }}
        run: node scripts/dirigent.mjs run
      - name: Run complete repository quality gate
        if: success()
        run: |
          node scripts/validate.mjs
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 >/tmp/whatsup-dog-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 0.5; done
          npx playwright test tests/v3.spec.mjs --reporter=line --global-timeout=180000
      - name: Dispatch independent PR quality gates
        if: success() && steps.execute.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.execute.outputs.branch }}
        run: |
          gh workflow run validate.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          gh workflow run browser-acceptance.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
      - name: Publish auditable result
        if: always()
        run: test ! -f dirigent-result.md || cat dirigent-result.md >> "$GITHUB_STEP_SUMMARY"
