name: Whatsup Dog map regression
on:
  pull_request:
    paths:
      - 'scripts/map-regression-qa.mjs'
      - 'app-v3.js'
      - 'index.html'
      - 'README.md'
      - '.github/workflows/agent-skills-pilot.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/map-regression-qa.mjs
      - run: node scripts/validate.mjs
