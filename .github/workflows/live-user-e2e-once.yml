name: One-shot Supabase production credential probe
on:
  push:
    branches:
      - test/hosted-production-e2e-20260915
    paths:
      - .github/live-user-e2e-trigger
permissions:
  contents: read
jobs:
  credential-probe:
    if: github.ref == 'refs/heads/test/hosted-production-e2e-20260915'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check availability without exposing values
        shell: bash
        run: |
          access=no
          password=no
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then access=yes; fi
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then password=yes; fi
          echo "SUPABASE_ACCESS_TOKEN_PRESENT=$access"
          echo "SUPABASE_DB_PASSWORD_PRESENT=$password"
          if [ "$access" != yes ] || [ "$password" != yes ]; then
            echo 'Required hosted Supabase migration credentials are not both available.'
            exit 2
          fi
          echo 'HOSTED_SUPABASE_MIGRATION_CREDENTIALS_PRESENT=true'
