name: Validate accountless V3
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate.mjs
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run V3 browser journeys
        run: |
          python3 -m http.server 8765 >/tmp/whatsup-dog-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi; sleep 0.5; done
          npx playwright test tests/v3.spec.mjs --reporter=line --global-timeout=180000
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-playwright-report
          path: playwright-report
          if-no-files-found: ignore
