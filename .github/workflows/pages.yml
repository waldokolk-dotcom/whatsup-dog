name: Publish PWA to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate.mjs
      - run: node scripts/walk-checklist-qa.mjs
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run accountless V3 browser journeys
        run: |
          python3 -m http.server 8765 >/tmp/whatsup-pages.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi; sleep 0.5; done
          npx playwright test tests/v3.spec.mjs tests/navigation-regression.spec.mjs tests/navigation-interaction.spec.mjs tests/walk-checklist.spec.mjs --reporter=line --global-timeout=600000
      - name: Verify hosted backend release
        run: node scripts/verify-hosted-release.mjs
      - run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify deployed Pages app and current assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location --max-time 15 "$PAGE_URL" -o /tmp/whatsup-live.html && grep -qi 'Whatsup Dog' /tmp/whatsup-live.html; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then echo "Deployed page is unreachable or missing app identity"; exit 1; fi
            sleep 5
          done
          # Ensure the hosted HTML references the exact CSS version built from this commit.
          expected_css=$(grep -oE 'modern-2026\.css\?v=[0-9]+' index.html | head -n 1)
          test -n "$expected_css"
          grep -Fq "$expected_css" /tmp/whatsup-live.html || { echo "Deployed HTML has stale stylesheet version"; exit 1; }
          for asset in app-v3.css modern-2026.css backend-config.js app-v3.js; do
            curl --fail --silent --show-error --location --max-time 15 "${PAGE_URL%/}/$asset" -o "/tmp/whatsup-$asset"
            test -s "/tmp/whatsup-$asset" || { echo "Empty hosted asset: $asset"; exit 1; }
            cmp -s "dist/$asset" "/tmp/whatsup-$asset" || { echo "Deployed asset differs from current build: $asset"; exit 1; }
          done
          echo "PASS: deployed HTML matches expected CSS version and four essential assets are nonempty"
