name: Publish PWA to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate.mjs
      - run: node scripts/dialog-ui-check.mjs
      - run: node scripts/mobile-ux-agent.mjs
      - run: node scripts/release-agent.mjs
      - run: node scripts/hosted-e2e-safety-check.mjs
      - name: Build isolated read-only preview for browser tests
        run: node scripts/build-preview.mjs
      - name: Install browser usability test tooling
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run autonomous usability journeys
        run: |
          python3 -m http.server 8765 >/tmp/whatsup-dog-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8765/ >/dev/null
          npm run test:usability
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usability-playwright-report
          path: playwright-report
          if-no-files-found: ignore
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db
      - run: node scripts/api-e2e.mjs
      - if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup
          fi
      - name: Refuse deployment against an outdated hosted database
        run: node scripts/verify-hosted-release.mjs
      - run: node scripts/build-site.mjs
      - name: Checkout isolated preview snapshot
        uses: actions/checkout@v4
        with:
          ref: 9f5a9a91a00f923b7295fceef846ebe92ade12e6
          path: .preview-source
          persist-credentials: false
      - name: Build read-only preview alongside unchanged production assets
        run: |
          cd .preview-source
          node scripts/build-preview.mjs
          cd ..
          mkdir -p dist/preview
          cp -a .preview-source/dist/. dist/preview/
          test -f dist/preview/preview-guard.js
          grep -q 'preview-guard.js?v=1' dist/preview/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
