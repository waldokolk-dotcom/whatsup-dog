name: Browser accountless V3 acceptance
on:
  pull_request:
    paths:
      - 'app-v3.*'
      - 'index.html'
      - 'sw.js'
      - 'tests/v3.spec.mjs'
      - '.github/workflows/browser-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run accountless app acceptance in three viewports
        run: |
          python3 -m http.server 8765 >/tmp/whatsup-browser.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..30}; do if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi; sleep 0.5; done
          npx playwright test tests/v3.spec.mjs --reporter=line --global-timeout=180000
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-browser-report
          path: playwright-report
          if-no-files-found: ignore
