name: Build isolated PWA preview artifact
on:
  pull_request:
    branches: [main]
    paths:
      - '**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wh-dog-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  preview:
    if: github.event_name != 'pull_request' || github.event.pull_request.number == 71
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source
        run: node scripts/validate.mjs
      - name: Build production-equivalent static PWA
        run: node scripts/build-site.mjs
      - name: Install browser test dependencies
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Exercise the actual preview bundle on iPhone and Android viewports
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/whatsup-preview.log 2>&1 &
          SERVER_PID=$!
          cd ..
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/ -o /tmp/whatsup-preview.html; then break; fi
            sleep 1
          done
          grep -qi 'Whatsup Dog' /tmp/whatsup-preview.html
          for asset in app-v3.js modern-2026.css backend-config.js sw.js; do
            curl -fsS "http://127.0.0.1:8765/$asset" -o "/tmp/preview-$asset"
            test -s "/tmp/preview-$asset"
          done
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:8765 npx playwright test tests/mobile-map-accessibility.spec.mjs --reporter=line --global-timeout=180000
      - name: Verify deployable files and exclude sensitive artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/manifest.webmanifest
          test -s dist/sw.js
          test -s dist/backend-config.js
          if find dist -type f | grep -Ei '(^|/)(\.env|.*\.sql|.*secret.*|.*service.role.*|.*\.pem)$'; then
            echo 'Unexpected sensitive artifact in preview bundle'
            exit 1
          fi
      - name: Upload isolated preview bundle (never deploy to production Pages)
        uses: actions/upload-artifact@v4
        with:
          name: whats-up-dog-pr71-preview-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
