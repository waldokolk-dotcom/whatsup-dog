# Separate, zero-cost static preview blueprint for PR #71.
# This file does not provision hosting automatically and does not alter GitHub Pages.
# Matches the existing authorized Render preview: use build-preview.mjs to keep writes isolated.\n# Never publish the unguarded production bundle from this preview blueprint.
services:
  - type: web
    name: whatsup-dog-pr71-preview
    runtime: static
    repo: https://github.com/waldokolk-dotcom/whatsup-dog
    branch: feature/map-first-mobile-20261030
    buildCommand: node scripts/validate.mjs && node scripts/build-preview.mjs
    staticPublishPath: ./dist
    autoDeployTrigger: off
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /sw.js
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
